<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title id="page-title">キューブ</title>
        <meta name="description" content="デュエルマスターズ キューブドラフト カードリスト">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="color-scheme" content="dark">
        <meta name="theme-color" content="#0e1116">
        <link rel="stylesheet" href="cube.css">
    </head>
    <body>
        <div class="page-shell">
            <header class="cube-header">
                <h1 id="cube-title">キューブ</h1>
                <nav>
                    <a href="../../index.html">トップに戻る</a>
                </nav>
            </header>

            <nav class="cube-tabs">
                <button type="button" class="cube-tab active" data-tab="list">カード一覧</button>
                <button type="button" class="cube-tab" data-tab="history">更新履歴</button>
                <button type="button" class="cube-tab" data-tab="deck-register">デッキ登録</button>
                <button type="button" class="cube-tab" data-tab="deck-list">デッキ一覧</button>
                <button type="button" class="cube-tab" data-tab="simulator">ドラフトシミュレータ</button>
            </nav>

            <section id="tab-list" class="cube-tab-panel active">
                <section class="civ-ratio">
                    <div id="civ-ratio" aria-label="文明比率"></div>
                    <div class="civ-ratio-divider"></div>
                    <div id="color-ratio" aria-label="単色/多色比率"></div>
                </section>

                <section class="filter-bar">
                    <div class="filter-row" id="civ-mode-row">
                        <span class="filter-label">文明</span>
                    </div>
                    <div class="filter-row" id="civ-filter-row"></div>
                    <div class="filter-row" id="civ-exclude-row" style="display:none;">
                        <span class="filter-label">多色カードに含めない文明</span>
                        <span id="civ-exclude-buttons"></span>
                    </div>
                    <div class="filter-row" id="civ-mode-toggle-row" style="display:none;">
                        <label class="check-label"><input type="radio" name="civRequireMode" value="all" id="civ-mode-all" checked> 選んだ文明をすべて含む</label>
                        <label class="check-label"><input type="radio" name="civRequireMode" value="any" id="civ-mode-any"> 選んだ文明を1つ以上含む</label>
                    </div>
                    <div class="filter-row" id="type-filter-row">
                        <span class="filter-label">タイプ</span>
                    </div>
                    <div class="filter-row" id="civ-consider-other-face-row" style="display:none;">
                        <label class="check-label"><input type="checkbox" id="civ-consider-other-face"> ツインパクトのもう一方に異なる文明が含まれる場合多色とみなす</label>
                    </div>
                    <div class="filter-row">
                        <span class="filter-group">
                            <span class="filter-label">コスト</span>
                            <input type="number" id="cost-min" class="cost-input" placeholder="下限" min="0">
                            <span>〜</span>
                            <input type="number" id="cost-max" class="cost-input" placeholder="上限" min="0">
                        </span>
                        <span class="filter-group">
                            <span class="filter-label">パワー</span>
                            <input type="number" id="power-min" class="cost-input" placeholder="下限" min="0">
                            <span>〜</span>
                            <input type="number" id="power-max" class="cost-input" placeholder="上限" min="0">
                        </span>
                        <span class="filter-group">
                            <span class="filter-label">カード名</span>
                            <input type="search" id="name-filter" class="name-input" placeholder="カード名で検索…">
                        </span>
                    </div>
                    <div class="filter-row">
                        <span class="filter-label">種族</span>
                        <input type="search" id="race-filter" class="name-input wide-input" placeholder="種族で検索…(スペース区切りで複数指定可)">
                        <span class="filter-group" id="race-mode-toggle"></span>
                    </div>
                    <div class="filter-row">
                        <span class="filter-label">テキスト</span>
                        <input type="search" id="ability-text-filter" class="name-input wide-input" placeholder="テキストで検索…(スペース区切りで複数指定可)">
                        <span class="filter-group" id="ability-text-mode-toggle"></span>
                    </div>
                    <div class="filter-row">
                        <label class="check-label"><input type="checkbox" id="enchant-only-filter"> エンチャント付与カードのみ</label>
                        <span class="filter-group">
                            <span class="filter-label">ツインパクト</span>
                            <select id="twinpact-select" class="tag-select">
                                <option value="show" selected>ツインパクトも表示する</option>
                                <option value="hide">ツインパクトを表示しない</option>
                                <option value="only">ツインパクトのみ表示する</option>
                            </select>
                        </span>
                        <span class="filter-group">
                            <span class="filter-label">並べ替え</span>
                            <select id="sort-select" class="tag-select">
                                <option value="default">デフォルト</option>
                                <option value="cost-asc">コストが低い順</option>
                                <option value="cost-desc">コストが高い順</option>
                                <option value="power-asc">パワーが低い順</option>
                                <option value="power-desc">パワーが高い順</option>
                                <option value="civilization">文明順</option>
                                <option value="cardType">カードタイプ順</option>
                            </select>
                        </span>
                        <span class="result-count" id="result-count"></span>
                        <button type="button" class="clear-filters" id="clear-filters">リセット</button>
                    </div>
                </section>

                <main>
                    <div class="card-grid" id="card-grid"></div>
                    <p class="empty-message" id="empty-message" style="display:none;">条件に一致するカードがありません。</p>
                </main>
            </section>

            <section id="tab-history" class="cube-tab-panel">
                <table class="history-table">
                    <thead><tr><th>日時</th><th>操作</th><th>カード名</th></tr></thead>
                    <tbody id="history-body"></tbody>
                </table>
                <p class="empty-message" id="history-empty" style="display:none;">更新履歴はまだありません。</p>
            </section>

            <section id="tab-deck-register" class="cube-tab-panel">
                <section class="filter-bar">
                    <div class="filter-row">
                        <span class="filter-label">カード名</span>
                        <div class="deck-suggest-wrap">
                            <input type="search" id="deck-card-search" class="name-input wide-input" placeholder="カード名を入力してください…">
                            <div id="deck-suggest-list" class="deck-suggest-list" hidden></div>
                        </div>
                    </div>
                </section>

                <div class="deck-building-header">
                    <span id="deck-building-count">0枚</span>
                    <button type="button" class="clear-filters" id="deck-save-btn">保存</button>
                </div>
                <main>
                    <div class="card-grid" id="deck-building-grid"></div>
                    <p class="empty-message" id="deck-building-empty">カードを検索して追加してください。</p>
                </main>
            </section>

            <section id="tab-deck-list" class="cube-tab-panel">
                <table class="history-table">
                    <thead><tr><th>デッキ名</th><th>種別</th><th>記録日時</th><th>枚数</th></tr></thead>
                    <tbody id="deck-list-body"></tbody>
                </table>
                <p class="empty-message" id="deck-list-empty" style="display:none;">記録されたデッキはまだありません。</p>
            </section>

            <section id="tab-simulator" class="cube-tab-panel">
                <div class="sim-screen" id="sim-setup-screen">
                    <section class="filter-bar">
                        <div class="filter-row">
                            <span class="filter-label">キューブ</span>
                            <select id="sim-cube-select" class="tag-select" disabled></select>
                        </div>
                        <div class="filter-row">
                            <span class="filter-label">ピック形式</span>
                        </div>
                        <div class="sim-format-radio-row" id="sim-format-radio-row">
                            <label class="sim-format-option">
                                <input type="radio" name="sim-format" value="glimpse" id="sim-format-glimpse" checked>
                                <span><strong>グリンプスドラフト(2人)</strong> — 15枚パック×2人、5ラウンド。1回に2枚採用+1枚除外を繰り返し、50枚から10枚を除いて40枚のデッキにします。</span>
                            </label>
                            <label class="sim-format-option">
                                <input type="radio" name="sim-format" value="normal" id="sim-format-normal">
                                <span><strong>通常ピック(6人)</strong> — 15枚パック×6人(CPU5体)、3ラウンド。1枚ずつ採用して隣へ回します。45枚から5枚を除いて40枚のデッキにします。</span>
                            </label>
                        </div>
                    </section>
                    <p class="form-error" id="sim-setup-error"></p>
                    <button type="button" class="clear-filters" id="sim-start-btn">ドラフトを開始</button>
                </div>

                <div class="sim-screen" id="sim-pick-screen" hidden>
                    <div class="sim-status-bar">
                        <span id="sim-status-pack"></span>
                        <span id="sim-status-turn"></span>
                        <span id="sim-status-count"></span>
                    </div>
                    <div class="sim-pick-layout">
                        <div class="card-grid" id="sim-pack-grid"></div>
                        <div class="sim-deck-list-wrap">
                            <h3>自分のデッキ</h3>
                            <div class="sim-ratio-row">
                                <div id="sim-deck-civ-pie"></div>
                                <div id="sim-deck-color-pie"></div>
                            </div>
                            <ul class="sim-deck-list-text" id="sim-deck-list-text"></ul>
                        </div>
                    </div>
                </div>

                <div class="sim-screen" id="sim-final-review-screen" hidden>
                    <div class="sim-final-actions">
                        <span id="sim-final-count"></span>
                        <button type="button" class="clear-filters" id="sim-final-confirm-top-btn" disabled>これで決定する</button>
                    </div>
                    <div class="card-grid" id="sim-final-grid"></div>
                    <div class="sim-final-actions">
                        <button type="button" class="clear-filters" id="sim-final-confirm-bottom-btn" disabled>これで決定する</button>
                    </div>
                </div>

                <div class="sim-screen" id="sim-finished-screen" hidden>
                    <section class="filter-bar">
                        <label class="deck-save-field">
                            <span>デッキ名（空欄可）</span>
                            <input type="text" id="sim-finished-name" placeholder="空欄の場合は記録日時を使用します">
                        </label>
                        <div class="sim-finished-actions">
                            <button type="button" class="clear-filters" id="sim-finished-image-btn">デッキ画像を出力</button>
                            <button type="button" class="clear-filters" id="sim-finished-record-btn">デッキを記録する</button>
                            <button type="button" class="deck-delete-btn" id="sim-restart-btn">もう一度ドラフトする</button>
                        </div>
                        <p class="form-error" id="sim-finished-error"></p>
                    </section>
                    <div class="card-grid" id="sim-finished-grid"></div>
                </div>
            </section>
        </div>

        <div class="card-modal" id="card-modal">
            <div class="card-modal-content">
                <button type="button" class="card-modal-close" id="card-modal-close" aria-label="閉じる">×</button>
                <div class="card-modal-image" id="card-modal-image"></div>
                <div class="card-modal-info">
                    <h2 id="card-modal-name"></h2>
                    <dl class="card-modal-basics" id="card-modal-basics"></dl>
                    <div class="card-modal-section" id="card-modal-ability-section">
                        <h3>テキスト</h3>
                        <p id="card-modal-ability"></p>
                    </div>
                    <div id="card-modal-twinpact-faces" style="display:none;"></div>
                    <div class="card-modal-section" id="card-modal-enchant-section" style="display:none;">
                        <h3>エンチャント</h3>
                        <p id="card-modal-enchant-text"></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-modal" id="deck-enchant-modal">
            <div class="modal-content-block">
                <button type="button" class="card-modal-close" id="deck-enchant-modal-close" aria-label="閉じる">×</button>
                <h2>エンチャントを設定</h2>
                <select id="deck-enchant-select" class="tag-select deck-enchant-select"></select>
            </div>
        </div>

        <div class="card-modal" id="deck-save-modal">
            <div class="modal-content-block">
                <button type="button" class="card-modal-close" id="deck-save-modal-close" aria-label="閉じる">×</button>
                <h2>デッキを保存</h2>
                <label class="deck-save-field">
                    <span>デッキ名（空欄可）</span>
                    <input type="text" id="deck-save-name" placeholder="空欄の場合は記録日時を使用します">
                </label>
                <label class="deck-save-field">
                    <span>備考</span>
                    <textarea id="deck-save-note" rows="4"></textarea>
                </label>
                <label class="deck-save-field">
                    <span>編集用パスワード</span>
                    <input type="password" id="deck-save-password" placeholder="パスワード">
                </label>
                <div class="modal-actions">
                    <button type="button" class="clear-filters" id="deck-save-confirm-btn">保存する</button>
                </div>
                <p class="form-error" id="deck-save-error"></p>
            </div>
        </div>

        <div class="card-modal" id="deck-detail-modal">
            <div class="modal-content-block modal-content-wide">
                <button type="button" class="card-modal-close" id="deck-detail-modal-close" aria-label="閉じる">×</button>
                <h2 id="deck-detail-name"></h2>
                <p class="deck-detail-meta" id="deck-detail-meta"></p>
                <p class="deck-detail-note" id="deck-detail-note"></p>
                <div class="deck-detail-actions">
                    <span class="deck-detail-sort-group">
                        <span class="deck-detail-sort-label">並べ替え</span>
                        <select id="deck-detail-sort-select" class="tag-select">
                            <option value="default">記録順</option>
                            <option value="cost-asc">コストが低い順</option>
                            <option value="cost-desc">コストが高い順</option>
                            <option value="civilization">文明順</option>
                            <option value="name">名前順(50音)</option>
                        </select>
                    </span>
                    <button type="button" class="clear-filters" id="deck-detail-image-btn">デッキ画像を保存</button>
                    <button type="button" class="deck-delete-btn" id="deck-detail-delete-btn">このデッキを削除</button>
                </div>
                <p class="form-error" id="deck-detail-error"></p>
                <div class="card-grid" id="deck-detail-grid"></div>
            </div>
        </div>

        <div class="card-modal" id="sim-pack-card-modal">
            <div class="card-modal-content">
                <button type="button" class="card-modal-close" id="sim-pack-card-modal-close" aria-label="閉じる">×</button>
                <div class="card-modal-image" id="sim-pack-card-modal-image"></div>
                <div class="card-modal-info">
                    <h2 id="sim-pack-card-modal-name"></h2>
                    <dl class="card-modal-basics" id="sim-pack-card-modal-basics"></dl>
                    <div class="card-modal-section">
                        <h3>テキスト</h3>
                        <p id="sim-pack-card-modal-ability"></p>
                    </div>
                    <div class="sim-pack-card-actions" id="sim-pack-card-actions"></div>
                </div>
            </div>
        </div>

        <div class="card-modal" id="sim-final-confirm-modal">
            <div class="modal-content-block">
                <button type="button" class="card-modal-close" id="sim-final-confirm-modal-close" aria-label="閉じる">×</button>
                <h2>これで確定しますか？</h2>
                <div class="modal-actions">
                    <button type="button" class="clear-filters" id="sim-final-confirm-ok-btn">確定する</button>
                </div>
            </div>
        </div>

        <div class="card-modal" id="sim-record-modal">
            <div class="modal-content-block">
                <button type="button" class="card-modal-close" id="sim-record-modal-close" aria-label="閉じる">×</button>
                <h2>デッキを記録</h2>
                <label class="deck-save-field">
                    <span>編集用パスワード</span>
                    <input type="password" id="sim-record-password" placeholder="パスワード">
                </label>
                <div class="modal-actions">
                    <button type="button" class="clear-filters" id="sim-record-confirm-btn">記録する</button>
                </div>
                <p class="form-error" id="sim-record-error"></p>
            </div>
        </div>

        <script src="cube.js"></script>
        <script src="simulator.js"></script>
    </body>
</html>
