    if(state == 0){ //落下中は入力を受け付けない
      if(66 <= mouseX && mouseX < 386 && 470 > mouseY && mouseY >= 110){
        cx = (mouseX - 66) / 40;
        cy = 8 - (mouseY - 110) / 40;
        /*println("mouseX = "+mouseX);
        println("(mouseX - 66) / 40 = "+(mouseX - 66) / 40);
        println("mouseY = "+mouseY);
        println("8 - (mouseX - 110) / 40 = "+ (8 - (mouseY - 110) / 40));*/
        if(tile[cx][cy] == 1){ //黒タイルをクリック(破壊)
          Btile(1);
        }else if(tile[cx][cy] == 2){ //白タイルをクリック(反転)
          println("blue");
          treverse(cx,cy);
        }
      }else if(66 <= mouseX && mouseX < 386 && 70 > mouseY && mouseY >= 30){ //NEXT落下
        state = 1;
        limit = limitMAX;
      }
    }
  }else if(scene == 2){ //ゲームオーバー
    scene = 3;
    for(int i = 0;i <= 9; i++){
      if(score >= rankPoint[i]){
        for(int j = 9;j > i; j--){
          rankName[j] = rankName[j-1];
          rankPoint[j] = rankPoint[j-1];
        }
        playerRank = i;
        rankPoint[i] = score;
        //rankName[i] = playerName;
        i = 10;
      }
    }
    if(playerRank < 0){
      scene = 4;
    }
  }else if(scene == 4){ //ランキング
    if(demo == -1){
      scene = -1;
      reset();
    }
  }else if(scene == -2){ //遊び方
    scene = -1;
    reset();
  }
}

void treverse (int x,int y){ //上下左右のタイルを反転させる
  if(y+1 <= 8){
    if(tile[x][y+1] == 1){
      tile[x][y+1] = 2;
    }else if(tile[x][y+1] == 2){
      tile[x][y+1] = 1;
    }
  }
  if(y-1 >= 0){
    if(tile[x][y-1] == 1){
      tile[x][y-1] = 2;
    }else if(tile[x][y-1] == 2){
      tile[x][y-1] = 1;
    }
  }
  if(x+1 <= 7){
    if(tile[x+1][y] == 1){
      tile[x+1][y] = 2;
    }else if(tile[x+1][y] == 2){
      tile[x+1][y] = 1;
    }
  }
  if(x-1 >= 0){
    if(tile[x-1][y] == 1){
      tile[x-1][y] = 2;
    }else if(tile[x-1][y] == 2){
      tile[x-1][y] = 1;
    }
  }
}

void brake(int x,int y){
  //破壊するタイルを走査
  //println(broken + "(" + x +"," + y + ")");
  check[x][y] = 1;
  broken++;
  if(x-1 >= 0){//右
    if(tile[x-1][y] == 1){
      if(check[x-1][y] <= 0){
        brake(x-1,y);
      }
    }
  }
  if(y-1 >= 0){//下
    if(tile[x][y-1] == 1){
      if(check[x][y-1] <= 0){
        brake(x,y-1);
      }
    }
  }
  if(y+1 <= 8){//上
    if(tile[x][y+1] == 1){
      if(check[x][y+1] <= 0){
        brake(x,y+1);
      }
    }
  }
  if(x+1 <= 7){//左
    if(tile[x+1][y] == 1){
      if(check[x+1][y] <= 0){
        brake(x+1,y);
      }
    }
  }
  
  check[x][y] = -1;
  
}
